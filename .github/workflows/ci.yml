name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Library and unit tests; no reference engine, so no parity tests.
  library:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        run: ctest --test-dir build -L unit --output-on-failure --parallel 4

  # Examples: build with SDL3 and run every one headless (no window, no GPU).
  examples:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev \
            libxkbcommon-dev libegl-dev libgl-dev libasound2-dev libudev-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install glslang
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DIVP_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Render and panel tests
        run: ctest --test-dir build -R "test_render_math|test_demo_panel" --output-on-failure
      - name: Run every example headless
        run: ctest --test-dir build -L smoke --output-on-failure
