name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Library and unit tests; no reference engine, so no parity tests.
  library:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Release unit contract
        run: >-
          python tools/run_verification.py
          --contract release-unit
          --build-dir build
          --parallel 4
          --evidence build/verification/release-unit-${{ runner.os }}.json
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-release-unit-${{ runner.os }}
          path: build/verification/*.json
          if-no-files-found: warn

  # Continuously enforce configurations that previously ran only as local
  # release checks. ThreadSanitizer stays scoped to the threading contract
  # tests because the full legacy suite is unnecessarily expensive under it.
  verification:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Instrumented Debug timings are not a performance signal, and the
          # benchmark runner's reference diagnostics exceed its 30 s timeout.
          - name: debug-float
            cmake_args: -DCMAKE_BUILD_TYPE=Debug -DIVP_REAL_DOUBLE=OFF
            contract: debug-float-unit
            parallel: 4
          - name: asan-ubsan
            cmake_args: -DCMAKE_BUILD_TYPE=Debug -DIVP_ENABLE_ASAN=ON -DIVP_ENABLE_UBSAN=ON
            contract: asan-ubsan-unit
            parallel: 2
          - name: tsan-threading
            cmake_args: -DCMAKE_BUILD_TYPE=Debug -DIVP_ENABLE_TSAN=ON
            contract: tsan-threading
            parallel: 1
    name: verification (${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -S . ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build --parallel
      - name: Verification contract
        run: >-
          python tools/run_verification.py
          --contract ${{ matrix.contract }}
          --build-dir build
          --parallel ${{ matrix.parallel }}
          --evidence build/verification/${{ matrix.name }}.json
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.name }}
          path: build/verification/*.json
          if-no-files-found: warn

  # Exercise every physics scenario without requiring the external reference
  # checkout.  These checks validate finite state and scenario-specific
  # invariants on pull requests as well as main.
  scenarios:
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          -DIVP_ENABLE_SCENARIO_TESTS=ON
      - name: Build scenario runner
        run: cmake --build build --target test_scenarios --parallel
      - name: Scenario invariant contract
        run: >-
          python tools/run_verification.py
          --contract scenario-invariants
          --build-dir build
          --parallel 4
          --evidence build/verification/scenario-invariants.json
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-scenario-invariants
          path: build/verification/*.json
          if-no-files-found: warn

  # Bit-exact parity is a macOS arm64 reproducibility-domain check.  Keep the
  # reference runner pinned and require both libivp policies on pull requests,
  # main, and manual runs.
  parity:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out reference engine
        uses: actions/checkout@v4
        with:
          repository: doyaGu/ivp
          ref: c82356f249b3bb0299cc2a135ecc563616ef3746
          path: reference/ivp
      - name: Release and Debug parity
        env:
          IVP_REF_SRC: ${{ github.workspace }}/reference/ivp
          IVP_JOBS: 3
        run: >-
          python tools/run_verification.py
          --contract parity
          --evidence build/verification/parity.json
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-parity
          path: build/verification/*.json
          if-no-files-found: warn

  # Examples: build with SDL3 and run every one headless (no window, no GPU).
  examples:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev \
            libxkbcommon-dev libegl-dev libgl-dev libasound2-dev libudev-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install glslang
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DIVP_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Headless example contract
        run: >-
          python tools/run_verification.py
          --contract examples-headless
          --build-dir build
          --parallel 2
          --evidence build/verification/examples-${{ runner.os }}.json
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-examples-${{ runner.os }}
          path: build/verification/*.json
          if-no-files-found: warn
