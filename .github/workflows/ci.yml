name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Library and unit tests; no reference engine, so no parity tests.
  library:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        policy: [reference, stable]
        include:
          - policy: reference
            suite: reference-unit
            cmake_args: ""
          - policy: stable
            suite: release-unit
            cmake_args: -DIVP_STABLE_INTERNAL_STATE=ON -DIVP_REENTRANT_QHULL=ON
    name: library (${{ matrix.os }}, ${{ matrix.policy }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Release focused-test suite
        run: >-
          python tools/run_verification.py
          --suite ${{ matrix.suite }}
          --build-dir build
          --parallel 4
          --result-file build/verification/${{ matrix.suite }}-${{ runner.os }}.json
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.suite }}-${{ runner.os }}
          path: build/verification/*.json
          if-no-files-found: warn

  # Continuously enforce configurations that previously ran only as local
  # release checks. ThreadSanitizer stays scoped to concurrent-execution tests
  # because the full legacy suite is unnecessarily expensive under it.
  verification:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Instrumented Debug timings are not a performance signal, and the
          # benchmark runner's reference diagnostics exceed its 30 s timeout.
          - name: debug-float
            cmake_args: -DCMAKE_BUILD_TYPE=Debug -DIVP_REAL_DOUBLE=OFF
            suite: debug-float-unit
            parallel: 4
          - name: asan-ubsan
            cmake_args: -DCMAKE_BUILD_TYPE=Debug -DIVP_ENABLE_ASAN=ON -DIVP_ENABLE_UBSAN=ON
            suite: asan-ubsan-unit
            parallel: 2
          # The optional determinism features: edit locality and checkpoints.
          - name: determinism-features
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DIVP_EDIT_LOCALITY=ON -DIVP_ENABLE_CHECKPOINTS=ON
            suite: determinism-features-unit
            parallel: 4
          - name: tsan-threading
            cmake_args: -DCMAKE_BUILD_TYPE=Debug -DIVP_ENABLE_TSAN=ON -DIVP_REENTRANT_QHULL=ON
            suite: tsan-threading
            parallel: 1
    name: verification (${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -S . -DIVP_STABLE_INTERNAL_STATE=ON ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build --parallel
      - name: Run verification suite
        run: >-
          python tools/run_verification.py
          --suite ${{ matrix.suite }}
          --build-dir build
          --parallel ${{ matrix.parallel }}
          --result-file build/verification/${{ matrix.name }}.json
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.name }}
          path: build/verification/*.json
          if-no-files-found: warn

  # Exercise every physics scenario without requiring the external reference
  # checkout.  These checks validate finite state and scenario-specific
  # invariants on pull requests as well as main.
  scenarios:
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          -DIVP_ENABLE_SCENARIO_TESTS=ON -DIVP_STABLE_INTERNAL_STATE=ON
      - name: Build scenario runner
        run: cmake --build build --target test_scenarios --parallel
      - name: Run scenario-invariant suite
        run: >-
          python tools/run_verification.py
          --suite scenario-invariants
          --build-dir build
          --parallel 4
          --result-file build/verification/scenario-invariants.json
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-scenario-invariants
          path: build/verification/*.json
          if-no-files-found: warn

  # Bit-exact parity is specific to the macOS arm64 build. Keep the
  # reference runner pinned and require both libivp policies on pull requests,
  # main, and manual runs.
  parity:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out reference engine
        uses: actions/checkout@v4
        with:
          repository: doyaGu/ivp
          ref: 0ca99d642f883a727aeb10d4f88f73322206c57a
          path: reference/ivp
      - name: Release and Debug parity
        env:
          IVP_REF_SRC: ${{ github.workspace }}/reference/ivp
          IVP_JOBS: 3
        run: >-
          python tools/run_verification.py
          --suite parity
          --result-file build/verification/parity.json
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-parity
          path: build/verification/*.json
          if-no-files-found: warn

  # Examples: build with SDL3 and run every one headless (no window, no GPU).
  examples:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev \
            libxkbcommon-dev libegl-dev libgl-dev libasound2-dev libudev-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install glslang
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DIVP_BUILD_EXAMPLES=ON -DIVP_STABLE_INTERNAL_STATE=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Run headless-example suite
        run: >-
          python tools/run_verification.py
          --suite examples-headless
          --build-dir build
          --parallel 2
          --result-file build/verification/examples-${{ runner.os }}.json
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-examples-${{ runner.os }}
          path: build/verification/*.json
          if-no-files-found: warn
