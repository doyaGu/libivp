name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Library and unit tests; no reference engine, so no parity tests.
  library:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit tests
        run: ctest --test-dir build -C Release -L unit --output-on-failure --parallel 4

  # Continuously enforce configurations that previously ran only as local
  # release checks. ThreadSanitizer stays scoped to the parallel contract
  # tests because the full legacy suite is unnecessarily expensive under it.
  verification:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug-float
            cmake_args: -DCMAKE_BUILD_TYPE=Debug -DIVP_REAL_DOUBLE=OFF
            test_args: -L unit --parallel 4
          - name: asan-ubsan
            cmake_args: -DCMAKE_BUILD_TYPE=Debug -DIVP_ENABLE_ASAN=ON -DIVP_ENABLE_UBSAN=ON
            test_args: -L unit --parallel 2
          - name: tsan-parallel
            cmake_args: -DCMAKE_BUILD_TYPE=Debug -DIVP_ENABLE_TSAN=ON
            test_args: -R "test_(parallel_worlds|internal_parallel|internal_state_stability|replay_equivalence|qhull_(concurrency|overlap))$" --parallel 1
    name: verification (${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -S . ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build --parallel
      - name: Tests
        run: ctest --test-dir build ${{ matrix.test_args }} --output-on-failure

  # Exercise every physics scenario without requiring the external reference
  # checkout.  These checks validate finite state and scenario-specific
  # invariants on pull requests as well as main.
  scenarios:
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          -DIVP_ENABLE_SCENARIO_TESTS=ON
      - name: Build scenario runner
        run: cmake --build build --target test_scenarios --parallel
      - name: Scenario invariants
        run: ctest --test-dir build -L invariants --output-on-failure --parallel 4

  # Bit-exact parity is a macOS arm64 reproducibility-domain check.  Keep the
  # reference runner pinned and run both libivp policies after changes land on
  # main (or when requested manually).
  parity:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out reference engine
        uses: actions/checkout@v4
        with:
          repository: doyaGu/ivp
          ref: c82356f249b3bb0299cc2a135ecc563616ef3746
          path: reference/ivp
      - name: Release and Debug parity
        env:
          IVP_REF_SRC: ${{ github.workspace }}/reference/ivp
          IVP_JOBS: 3
        run: tools/parity/check.sh

  # Examples: build with SDL3 and run every one headless (no window, no GPU).
  examples:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev \
            libxkbcommon-dev libegl-dev libgl-dev libasound2-dev libudev-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install glslang
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DIVP_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Render and panel tests
        run: ctest --test-dir build -R "test_render_math|test_demo_panel" --output-on-failure
      - name: Run every example headless
        run: ctest --test-dir build -L smoke --output-on-failure
